# L2 · lgd-itu-review —— 标准/ITU 递交纪律 + 专项审核（建议性，非阻塞）
# 覆盖理论/LGD/标准/治理族（D7 精准扩面，激活条件见 GOVERNED.md 单一真源）。
# ITU 专家（standards-participation-officer）负责维护本仓的 itu-review-rules.md。
#
# 🔴 v2.0 关键改造（2026-10-05 · Steven「按你建议」授权后）
#   问题：旧版把「递交纪律硬检查」与「LLM 调用」捆在同一个 job 的同一段代码里，
#        且开头就 `if not (KEY and BASE and MODEL): post(warning); exit(0)` 短路——
#        导致未配 BYOK 密钥时，**递交纪律硬检查（零品牌/零 DOI-pin/零内部注释）整块永不执行**，
#        形同虚设（全机禁令在 GitHub 侧无任何机器执行）。
#   改造：拆成两个独立 job——
#     job1 discipline-check：**纯 python 正则、零 LLM、零密钥**，永远执行，命中即发告警评论。
#     job2 itu-llm-review：仅在配了 BYOK 密钥时才跑，负责 ITU 术语/引用格式等「AI 才该干」的活。
#   ⇒ 核心禁令执行不再依赖任何密钥 / 网络 / 付费服务。
#
# 零外部 action 依赖：不引用 actions/checkout，兼容组织级 "selected actions + SHA pinning" 策略。
name: lgd-itu-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  # ─────────────────────────────────────────────────────────────
  # job1 · 递交纪律硬检查（纯规则 · 无需密钥 · 永远执行）
  # ─────────────────────────────────────────────────────────────
  discipline-check:
    name: lgd-itu-discipline
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != '' &&
       contains(github.event.comment.body, '/itu-review'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check scope (skip if not standards-submission-relevant)
        id: scope
        env:
          REPO: ${{ github.repository }}
        run: |
          # 激活范围（D7 精准扩面）：与 GOVERNED.md / deploy_full_governance.py 关键字保持一致。
          if printf '%s' "$REPO" | grep -qiE "itu|lgd|theory|standards|governance|gov-|passport|trust-identity|ai-gov|synomos-?ai|agent-trust|nomos-ai|didaskalos|krites|logos-ambassador|fingerprint|provenance|credential-vault|authz-code|identity-verify|sec2-provenance|culpachain|assurability|assayance|terminance|runtigil|premise-and-config-audit|research-quality-gate|publish-quality-gate|continuous-test-review-loop|ai-grader|code-review-standard|traceability-audit-team|audit-trail-keeper"; then
            echo "itu=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh api "repos/$REPO/contents/.lgd-itu" >/dev/null 2>&1; then echo "itu=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "itu=0" >> "$GITHUB_OUTPUT"

      - name: Submission-discipline hard check (pure regex, no LLM, no secrets)
        if: steps.scope.outputs.itu == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          REPO = os.environ["REPO"]
          PR   = (os.environ.get("PR_NUMBER") or "").strip()

          def post(body):
              if PR:
                  subprocess.run(["gh","api","-X","POST",
                      f"repos/{REPO}/issues/{PR}/comments","-f",f"body={body}"])

          # 取 diff（不依赖 actions/checkout）
          try:
              if PR:
                  diff = subprocess.check_output(
                      ["gh","api",f"repos/{REPO}/pulls/{PR}",
                       "-H","Accept: application/vnd.github.v3.diff"], text=True)
              else:
                  before, after = os.environ.get("BEFORE"), os.environ.get("AFTER")
                  diff = subprocess.check_output(
                      ["gh","api",f"repos/{REPO}/compare/{before}...{after}",
                       "-H","Accept: application/vnd.github.v3.diff"], text=True)
          except Exception as e:
              print("discipline: diff fetch fail:", e); sys.exit(0)

          # ── 递交纪律规则集（纯正则，无需 LLM；由 ITU 专家维护，与 itu-review-rules.md §3 对齐）──
          RULES = [
              ("内部流程注释",
               r"<!--\s*(内部|草稿|draft|internal|todo|讨论)|须过.{0,6}机器闸|专家终审"),
              ("品牌块（对外贡献禁带）",
               r"synomosai|medxpert|synomos-?ai"),
              ("权利宣告块（对外贡献禁带）",
               r"copyright|all rights reserved|版权所有|权利声明|©"),
              ("出版物锚 / DOI-pin",
               r"canonical[_\s:=]?|10\.5281/zenodo|doi\.org/10\.5281|zenodo\s*doi"),
              ("身份信号 ORCID",
               r"orcid|0000-\d{4}-\d{4}-\d{3}[\dX]"),
          ]

          # 只扫「新增行」（diff 以 + 开头），避免把既有代码/规则文档本身报成违规
          #
          # 🔴 路径豁免（v2.0 自查后加，防自我误报）：治理基础设施自身必然含品牌/规则关键词
          #    （改 lgd-itu-review.yml 的 PR，其 diff 里就写着 synomosai/medxpert/canonical…），
          #    若不豁免，改门禁的 PR 必然自我告警 → 告警噪音化 → 维护者脱敏。
          #
          # 🔴 v2.1 红队 F2 修复：旧版用裸子串 `x in cur_file`，导致 13 个路径逃逸
          #    （.github/workflows/notes.md、GOVERNED.md.bak、docs/GOVERNED.md、xverify_l0.py…）。
          #    现改为**精确判据**：① 工作流目录只豁免 .yml/.yaml（该目录本就该只有工作流）
          #                     ② 其余按 basename 精确相等（先剥目录）
          #                     ③ 目录名伪装（如 docs/.github/workflows/）不豁免（须以 / 开头）
          import posixpath
          def _exempt(path):
              p = path.strip()
              # ⚠️ v2.1 修：旧版用 lstrip("b/") 会按「字符集」剥前缀 → "docs/GOVERNED.md"
              #    的开头 d 会被一起剥掉，误判为 GOVERNED.md 而错误豁免。
              #    改为精确剥一次 "b/" 前缀（diff 头形如 +++ b/path）。
              if p.startswith("b/"):
                  p = p[2:]
              if not p or p == "/dev/null":
                  return False
              # ① 工作流目录：只豁免真正的 .yml/.yaml
              if p.startswith(".github/workflows/") and p.endswith((".yml", ".yaml")):
                  return True
              base = posixpath.basename(p)             # ② 其余按 basename 精确相等
              return base in ("itu-review-rules.md", "GOVERNED.md",
                              "verify_l0.py", "fix_ruleset_l0.py",
                              "deploy_full_governance.py", "deploy_nocheckout.py",
                              "robot_review_redteam_tests.py")

          hits = []
          cur_file = ""
          for line in diff.splitlines():
              # 追踪当前 diff 所属文件（diff 头形如: +++ b/path/to/file）
              if line.startswith("+++ "):
                  cur_file = line[4:].strip()
                  continue
              if not line.startswith("+"):
                  continue
              if _exempt(cur_file):
                  continue
              for label, pat in RULES:
                  if re.search(pat, line, re.I):
                      hits.append((label, line.strip()[:140]))
                      break

          # ── 自测变异（who-tests-the-tester）· v2.1 ──
          # 🔴 红队 F1 修复：旧版自检写在「if not hits: sys.exit(0)」之后 ⇒ clean 路径（常见情况）
          #    永远跑不到自检；且即使跑到也只 print(..., file=stderr)，脚本正常退出 → job 仍绿
          #    ⇒ 规则可被静默阉割、零可见告警。
          #    现改为：**在 clean 分支之前**执行，且失败 **sys.exit(1)** 让 job 真的红。
          #    仍保持非阻塞（不作为 required check），但"自己坏了"必须可见。
          import re as _re
          samples = [
              ("<!-- 内部草稿 -->", RULES[0][1]), ("<!-- internal -->", RULES[0][1]),
              ("<!-- draft -->", RULES[0][1]),
              ("须过 A3 机器闸", RULES[0][1]), ("专家终审", RULES[0][1]),
              ("SynomosAI 品牌块", RULES[1][1]), ("MedXpert", RULES[1][1]),
              ("synomos-ai", RULES[1][1]),
              ("All rights reserved", RULES[2][1]), ("版权所有 赵兴华", RULES[2][1]),
              ("© 2026", RULES[2][1]),
              ("doi.org/10.5281/zenodo.1234", RULES[3][1]),
              ("10.5281/zenodo.999", RULES[3][1]), ("canonical: https://x", RULES[3][1]),
              ("ORCID 0000-0001-2345-6789", RULES[4][1]),
          ]
          broken = [s for s, p in samples if not _re.search(p, s, _re.I)]
          if broken:
              print(f"discipline: SELF-TEST FAILED ({len(broken)}/{len(samples)} 样本未命中): {broken}",
                    file=sys.stderr)
              post("**🚨 LGD 递交纪律检查 · 自检失败**\n\n"
                   f"规则库已被改坏：{len(broken)}/{len(samples)} 个已知违规样本未被命中。\n\n"
                   f"未命中样本：\n" + "".join(f"- `{b}`\n" for b in broken) +
                   "\n> 本次检查结果**不可信**，请人工复核。规则维护请联系 ITU 专家。")
              sys.exit(1)   # 🔴 让 job 真的红 —— 自己坏了必须可见
          print(f"discipline: self-test OK ({len(samples)}/{len(samples)})")

          if not hits:
              post("**📋 LGD 递交纪律检查**\n\n"
                   "✅ 未发现内部流程注释 / 品牌块 / 权利宣告 / DOI-pin / ORCID。\n\n"
                   f"<sub>纯规则检查（零 LLM、零密钥），规则自检 {len(samples)}/{len(samples)} 通过；`/itu-review` 可重跑。</sub>")
              print("discipline: clean"); sys.exit(0)

          body = ("**📋 LGD 递交纪律检查** — ⚠️ 命中 "
                  f"{len(hits)} 行疑似「不得出门」内容\n\n"
                  "按 2026-10-02 全机禁令（第三方流程仓递交＝议题 ≠ 投稿）：\n"
                  "**零品牌、零 DOI/pin、零内部流程注释**。以下须清除后再递交：\n\n")
          for label, text in hits[:15]:
              body += f"- **{label}** — `{text}`\n"
          if len(hits) > 15:
              body += f"\n<sub>（另有 {len(hits)-15} 行未列出）</sub>\n"
          body += ("\n---\n> 纯规则检查（零 LLM、零密钥），非阻塞不拦合并；"
                   f"规则自检 {len(samples)}/{len(samples)} 通过。`/itu-review` 可重跑。")
          post(body)
          print(f"discipline: FLAGGED {len(hits)} line(s)")
          PY

  # ─────────────────────────────────────────────────────────────
  # job2 · ITU 专项 AI 审阅（仅在配了 BYOK 密钥时运行 · 建议性）
  # ─────────────────────────────────────────────────────────────
  itu-llm-review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != '' &&
       contains(github.event.comment.body, '/itu-review'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL:    ${{ secrets.LLM_MODEL }}
      GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
      REPO:         ${{ github.repository }}
      PR_NUMBER:    ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Skip if BYOK not configured (fail-open, 不静默)
        id: byok
        run: |
          if [ -n "$LLM_API_KEY" ] && [ -n "$LLM_BASE_URL" ] && [ -n "$LLM_MODEL" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
          fi
      - name: ITU specialist review (BYOK)
        if: steps.byok.outputs.ready == '1'
        run: |
          python3 - <<'PY'
          import os, re, json, base64, urllib.request, subprocess, sys

          REPO=os.environ["REPO"]; PR=(os.environ.get("PR_NUMBER") or "").strip()
          KEY=os.environ["LLM_API_KEY"]; BASE=os.environ["LLM_BASE_URL"].rstrip("/"); MODEL=os.environ["LLM_MODEL"]

          # ITU 规则集（ITU 专家维护）—— 经 API 取文件内容，不依赖 checkout
          rules = "(规则集缺失，请 ITU 专家补 itu-review-rules.md)"
          try:
              b64 = subprocess.check_output(
                  ["gh","api",f"repos/{REPO}/contents/itu-review-rules.md","--jq",".content"],
                  text=True).strip()
              rules = base64.b64decode(b64).decode("utf-8", "replace")
          except Exception:
              pass

          try:
              if PR:
                  diff=subprocess.check_output(
                      ["gh","api",f"repos/{REPO}/pulls/{PR}",
                       "-H","Accept: application/vnd.github.v3.diff"],text=True)
              else:
                  before, after = os.environ.get("BEFORE"), os.environ.get("AFTER")
                  diff=subprocess.check_output(
                      ["gh","api",f"repos/{REPO}/compare/{before}...{after}",
                       "-H","Accept: application/vnd.github.v3.diff"],text=True)
          except Exception as e:
              print("itu-llm: diff fail", e); sys.exit(0)

          diff=diff[:10000]
          SYSTEM=(f"你是 ITU 标准参编专项审阅者（ITU 专家负责）。请基于 PR diff 与以下 ITU 规则集，"
                  f"给出中文专项审阅：1) ITU-T/FG-TIDA 术语与建议书引用格式(如 ITU-T Rec. X.xxx)；"
                  f"2) 与标准参编合规勾稽；3) 是否适合作为『议题』递交（非我方出版物搬运）。"
                  f"控制在 300 字内，分条。\n\n### ITU 规则集\n{rules}")
          body=json.dumps({"model":MODEL,"messages":[
              {"role":"system","content":SYSTEM},
              {"role":"user","content":"PR diff:\n"+diff}]})
          req=urllib.request.Request(BASE+"/chat/completions", data=body.encode(),
              headers={"Authorization":f"Bearer {KEY}","Content-Type":"application/json"})
          try:
              resp=json.load(urllib.request.urlopen(req, timeout=120))
              review=resp["choices"][0]["message"]["content"]
          except Exception as e:
              print("itu-llm: LLM call fail", e); sys.exit(0)

          msg=(f"**📡 LGD ITU 专项 AI 审阅（ITU 专家规则 · 建议性，非阻塞）**\n\n{review}\n\n"
               "---\n> 本条由 LLM 生成，仅供参考。递交纪律硬检查见上方 `lgd-itu-discipline`（纯规则）。"
               "对外件最终仍须 Steven 亲手/批准。")
          if PR:
              subprocess.run(["gh","api","-X","POST",
                  f"repos/{REPO}/issues/{PR}/comments","-f",f"body={msg}"])
          print("itu-llm: posted")
          PY
