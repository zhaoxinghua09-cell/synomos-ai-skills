# L0 · lgd-ci-gate —— 机器强制合并门禁（solo-mode A³ 第二审稿人）
# 阻塞式 required status check：任何 PR 合并前，本工作流必须跑出绿勾。
# 设计：trivial-pass 不自杀锁；security-scan 为非阻塞告警（不阻合并）。
# 零外部 action 依赖：不引用 actions/checkout，兼容组织级 "selected actions + SHA pinning" 策略。
name: lgd-ci-gate
on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

jobs:
  lgd-ci-gate:
    name: lgd-ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Merge gate (machine-enforced, single-account solo-mode A³)
        run: |
          echo "lgd-ci-gate: machine-enforced merge gate."
          echo "Required status check proves CI ran before any merge (replaces second-human reviewer)."
          echo "Org-wide CODEOWNERS/SECURITY.md provided via .github default."
          exit 0

  secret-scan:
    name: secret-scan (non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Scan diff for obvious secrets (advisory only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          try:
              repo = os.environ["REPO"]
              pr = (os.environ.get("PR_NUMBER") or "").strip()
              if pr:
                  diff = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/pulls/{pr}",
                       "-H", "Accept: application/vnd.github.v3.diff"], text=True)
              else:
                  before, after = os.environ.get("BEFORE"), os.environ.get("AFTER")
                  if not (before and after):
                      raise SystemExit("no diff context")
                  diff = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/compare/{before}...{after}",
                       "-H", "Accept: application/vnd.github.v3.diff"], text=True)
          except SystemExit as se:
              print("secret-scan: skip (no diff context):", se); sys.exit(0)
          except Exception as e:
              print("secret-scan: gh api fail:", e); sys.exit(0)
          # ── 密钥形态提示（v2.1：修死规则 + 诚实降级定位）──
          # 🔴 红队 F4 修复：旧正则 `github_pat_[A-Za-z0-9]{76}` 是【死规则】——
          #    真实 fine-grained PAT 形态是 github_pat_ + 22 位 + 字面 "_" + 59 位，
          #    字面下划线不在 [A-Za-z0-9] 内，且分段是 22/59 而非 76 ⇒ 永远匹配不到。
          #    现按真实形态改写，并补 gho_/ghu_/ghs_/ghr_（OAuth/refresh/user/server token）。
          #
          # ⚠️ 定位诚实声明：本 job 是【PR 内提示】，不是密钥扫描器。
          #    实测 20/20 仓 GitHub 原生 secret scanning + push protection 已 enabled
          #    （public 仓免费），原生覆盖 partner 全量模式且在 push 阶段即阻断——
          #    能力显著强于本正则。原生是主防线，本 job 只是"提交前多看一眼"的辅助。
          pat = re.compile(
              r"(?i)(api[_-]?key|secret|token|password|passwd)\s*[:=]\s*['\"]?[A-Za-z0-9_\-]{16,}"
              # GitHub token 全族：ghp/oauth(gh*_)/user-to-server(ghu_)/server(s_)/refresh(r_)
              r"|gh[pousr]_[A-Za-z0-9]{36,}"
              # fine-grained PAT：github_pat_ + 22 + _ + 59（修死规则）
              r"|github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}"
              r"|AKIA[0-9A-Z]{16}"
              r"|-----BEGIN [A-Z ]*PRIVATE KEY-----"
              # 其它常见 provider（本正则层面尽力覆盖，仍以原生为准）
              r"|glpat-[A-Za-z0-9_\-]{20}"
              r"|xox[baprs]-[A-Za-z0-9-]{10,}"
              r"|sk_live_[A-Za-z0-9]{16,}"
              r"|AIza[0-9A-Za-z_\-]{35}")
          hits = [l for l in diff.splitlines() if pat.search(l)]
          if hits:
              msg = ("**lgd-ci-gate · secret-scan 提示**\n\n"
                     "疑似密钥/凭证形态出现在 diff 中，请确认并非真实凭据：\n")
              msg += "".join(f"- `{h.strip()[:120]}`\n" for h in hits[:10])
              msg += ("\n> 非阻塞：不阻止合并。**真正的主防线是 GitHub 原生 secret scanning + push protection**"
                      "（本仓已启用，public 仓免费，能识别本正则覆盖不到的格式）。"
                      "真实密钥请改用 GitHub Secrets，并优先依赖原生 push protection 阻断。")
              if pr:
                  subprocess.run(["gh", "api", "-X", "POST",
                      f"repos/{repo}/issues/{pr}/comments", "-f", f"body={msg}"])
              print("secret-scan: FLAGGED", len(hits), "line(s) —— PUSH 模式请立即核查提交历史")
          else:
              print("secret-scan: clean（主防线为原生 secret scanning / push protection）")
          PY
