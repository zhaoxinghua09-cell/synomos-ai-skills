<svg viewBox="0 0 680 500" width="100%" role="img">
  <title>统一凭据库：身份脊柱 + 子授权账号模型</title>
  <desc>Persona 主身份聚合微信/支付宝/GitHub 主账号，平台下可挂子账号，Broker 基于 JIT 向 agent 发短时限域令牌。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="600" height="420" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="60" y="66" fill="#0C447C" font-size="14">统一凭据库 · 身份脊柱 + 子授权模型</text>
  <text class="ts" x="60" y="84" fill="#185FA5" font-size="12">brain_vault.kdbx · 零知识 · 一切本地加密</text>

  <g>
    <rect x="260" y="100" width="160" height="60" rx="12" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="340" y="124" text-anchor="middle" fill="#0C447C" dominant-baseline="central">用户 主身份</text>
    <text class="ts" x="340" y="144" text-anchor="middle" fill="#0C447C" dominant-baseline="central">Persona · 关联属性本地加密</text>
  </g>

  <g>
    <rect x="50" y="210" width="170" height="56" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="135" y="232" text-anchor="middle" fill="#0C447C" dominant-baseline="central">微信</text>
    <text class="ts" x="135" y="252" text-anchor="middle" fill="#0C447C" dominant-baseline="central">主账号 · tag id:用户</text>
  </g>
  <g>
    <rect x="255" y="210" width="170" height="56" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="340" y="232" text-anchor="middle" fill="#0C447C" dominant-baseline="central">支付宝</text>
    <text class="ts" x="340" y="252" text-anchor="middle" fill="#0C447C" dominant-baseline="central">主账号 · tag id:用户</text>
  </g>
  <g>
    <rect x="460" y="210" width="170" height="56" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="545" y="232" text-anchor="middle" fill="#0C447C" dominant-baseline="central">GitHub</text>
    <text class="ts" x="545" y="252" text-anchor="middle" fill="#0C447C" dominant-baseline="central">主账号 · tag id:用户</text>
  </g>

  <g>
    <rect x="50" y="300" width="170" height="50" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="135" y="320" text-anchor="middle" fill="#633806" dominant-baseline="central">微信 子账号</text>
    <text class="ts" x="135" y="338" text-anchor="middle" fill="#633806" dominant-baseline="central">scope 受限</text>
  </g>
  <g>
    <rect x="255" y="300" width="170" height="50" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="320" text-anchor="middle" fill="#633806" dominant-baseline="central">支付宝 子账号</text>
    <text class="ts" x="340" y="338" text-anchor="middle" fill="#633806" dominant-baseline="central">scope 受限</text>
  </g>
  <g>
    <rect x="460" y="300" width="170" height="50" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="545" y="320" text-anchor="middle" fill="#633806" dominant-baseline="central">GitHub 子账号</text>
    <text class="ts" x="545" y="338" text-anchor="middle" fill="#633806" dominant-baseline="central">scope 受限</text>
  </g>

  <g>
    <rect x="230" y="392" width="220" height="54" rx="12" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="412" text-anchor="middle" fill="#633806" dominant-baseline="central">Broker (JIT)</text>
    <text class="ts" x="340" y="430" text-anchor="middle" fill="#633806" dominant-baseline="central">短时 · 窄域 · 可审计令牌</text>
  </g>

  <path d="M300 160 L135 210" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 160 L340 210" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M380 160 L545 210" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="205" y="190" fill="#185FA5" font-size="11">identity=用户</text>

  <path d="M135 266 L135 300" fill="none" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4 3"/>
  <path d="M340 266 L340 300" fill="none" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4 3"/>
  <path d="M545 266 L545 300" fill="none" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="560" y="288" fill="#854F0B" font-size="11">scope</text>

  <path d="M545 350 L450 392" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="ts" x="492" y="376" fill="#854F0B" font-size="11">仅 GitHub 授权 agent</text>
</svg>