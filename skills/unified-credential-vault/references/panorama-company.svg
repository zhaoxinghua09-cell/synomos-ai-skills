<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="800" fill="#F7F8FA"/>

  <!-- Title -->
  <text x="340" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">统一凭据体系 · 公司版：槽点 vs 我们的方案</text>
  <text x="340" y="70" text-anchor="middle" font-size="13" fill="#5B6B7B">角色分级 · 合规审计 · 人员变动自动回收 · 专家+管理员双保险</text>

  <!-- Column headers -->
  <rect x="20" y="92" width="310" height="32" rx="8" fill="#FDECEC" stroke="#F5C2C2"/>
  <text x="175" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">当前槽点（公司场景）</text>
  <rect x="350" y="92" width="310" height="32" rx="8" fill="#E9F7EF" stroke="#B7E4C7"/>
  <text x="505" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#15A05A">我们的方案（公司版）</text>

  <!-- ===== LEFT cards (pain points) ===== -->
  <rect x="20" y="140" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="26" y="150" width="5" height="76" rx="2.5" fill="#E5484D"/>
  <circle cx="50" cy="170" r="13" fill="#E5484D"/>
  <text x="50" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="72" y="175" font-size="15" font-weight="700" fill="#1F2933">离职凭据丢失</text>
  <text x="44" y="202" font-size="12" fill="#5B6B7B">业务 API 在个人脑里</text>
  <text x="44" y="222" font-size="12" fill="#5B6B7B">离职带走或遗忘难回收</text>

  <rect x="20" y="248" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="26" y="258" width="5" height="76" rx="2.5" fill="#E5484D"/>
  <circle cx="50" cy="278" r="13" fill="#E5484D"/>
  <text x="50" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="72" y="283" font-size="15" font-weight="700" fill="#1F2933">多人共用同一密钥</text>
  <text x="44" y="310" font-size="12" fill="#5B6B7B">FDA·CE·支付·云一把钥匙</text>
  <text x="44" y="330" font-size="12" fill="#5B6B7B">无隔离，无责任界定</text>

  <rect x="20" y="356" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="26" y="366" width="5" height="76" rx="2.5" fill="#E5484D"/>
  <circle cx="50" cy="386" r="13" fill="#E5484D"/>
  <text x="50" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="72" y="391" font-size="15" font-weight="700" fill="#1F2933">合规审计空白</text>
  <text x="44" y="418" font-size="12" fill="#5B6B7B">等保2.0·ISO27001·PIPL</text>
  <text x="44" y="438" font-size="12" fill="#5B6B7B">查不到谁用了什么凭据</text>

  <rect x="20" y="464" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="26" y="474" width="5" height="76" rx="2.5" fill="#E5484D"/>
  <circle cx="50" cy="494" r="13" fill="#E5484D"/>
  <text x="50" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="72" y="499" font-size="15" font-weight="700" fill="#1F2933">业务系统各自为政</text>
  <text x="44" y="526" font-size="12" fill="#5B6B7B">注册门户·支付·云·官网</text>
  <text x="44" y="546" font-size="12" fill="#5B6B7B">各记各，无统一中台</text>

  <rect x="20" y="572" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="26" y="582" width="5" height="76" rx="2.5" fill="#E5484D"/>
  <circle cx="50" cy="602" r="13" fill="#E5484D"/>
  <text x="50" y="607" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
  <text x="72" y="607" font-size="15" font-weight="700" fill="#1F2933">权限回收滞后</text>
  <text x="44" y="634" font-size="12" fill="#5B6B7B">调岗离职权限还在</text>
  <text x="44" y="654" font-size="12" fill="#5B6B7B">风险敞口大</text>

  <!-- ===== RIGHT cards (our solution) ===== -->
  <rect x="350" y="140" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="356" y="150" width="5" height="76" rx="2.5" fill="#15A05A"/>
  <circle cx="380" cy="170" r="13" fill="#15A05A"/>
  <text x="380" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="402" y="175" font-size="15" font-weight="700" fill="#1F2933">企业 vault + 角色分级</text>
  <text x="374" y="202" font-size="12" fill="#5B6B7B">RBAC：管理员·财务·注册·研发</text>
  <text x="374" y="222" font-size="12" fill="#5B6B7B">根口令派生子凭据</text>

  <rect x="350" y="248" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="356" y="258" width="5" height="76" rx="2.5" fill="#15A05A"/>
  <circle cx="380" cy="278" r="13" fill="#15A05A"/>
  <text x="380" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="402" y="283" font-size="15" font-weight="700" fill="#1F2933">人员变动自动回收</text>
  <text x="374" y="310" font-size="12" fill="#5B6B7B">离职调岗触发回收</text>
  <text x="374" y="330" font-size="12" fill="#5B6B7B">密钥轮换有台账</text>

  <rect x="350" y="356" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="356" y="366" width="5" height="76" rx="2.5" fill="#15A05A"/>
  <circle cx="380" cy="386" r="13" fill="#15A05A"/>
  <text x="380" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="402" y="391" font-size="15" font-weight="700" fill="#1F2933">合规审计台账</text>
  <text x="374" y="418" font-size="12" fill="#5B6B7B">全量操作留痕</text>
  <text x="374" y="438" font-size="12" fill="#5B6B7B">对接等保/ISO/PIPL 取证</text>

  <rect x="350" y="464" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="356" y="474" width="5" height="76" rx="2.5" fill="#15A05A"/>
  <circle cx="380" cy="494" r="13" fill="#15A05A"/>
  <text x="380" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="402" y="499" font-size="15" font-weight="700" fill="#1F2933">统一中台对接业务</text>
  <text x="374" y="526" font-size="12" fill="#5B6B7B">同一零知识架构分发</text>
  <text x="374" y="546" font-size="12" fill="#5B6B7B">FDA·CE·支付·云 全覆盖</text>

  <rect x="350" y="572" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="356" y="582" width="5" height="76" rx="2.5" fill="#15A05A"/>
  <circle cx="380" cy="602" r="13" fill="#15A05A"/>
  <text x="380" y="607" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
  <text x="402" y="607" font-size="15" font-weight="700" fill="#1F2933">专家 + 管理员双保险</text>
  <text x="374" y="634" font-size="12" fill="#5B6B7B">统一凭据安全专家 + 公司管理员</text>
  <text x="374" y="654" font-size="12" fill="#5B6B7B">break-glass 双人复核</text>

  <!-- ===== Bottom architecture banner ===== -->
  <rect x="20" y="688" width="640" height="96" rx="12" fill="#EEF4FF" stroke="#3B82F6"/>
  <text x="36" y="712" font-size="13" font-weight="700" fill="#1E40AF">核心架构 · 零知识信封加密（公司真相源 = 企业 .kdbx + 审计日志，专家与管理员共管）</text>
  <text x="36" y="738" font-size="12" fill="#334155">① 核心根口令 → ② Argon2id 派生 256 位 Vault Key → ③ AES-256-GCM 信封加密</text>
  <text x="36" y="760" font-size="12" fill="#334155">④ 加密库仅存企业可控云盘（零知识，服务端只见密文）→ ⑤ 各端解封即用 + 审计留痕</text>
  <text x="36" y="780" font-size="11" fill="#475569">负责专家：credential-vault-steward + 公司管理员 全程记录维护 + 应急恢复</text>
</svg>
