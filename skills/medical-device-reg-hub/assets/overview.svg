<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" role="img">
  <title>MedXpert-REG-001 医械注册全生命周期全景图</title>
  <desc>七个阶段：需求立项、分类路径、技术文件、质量体系、注册申报、审评获批、上市后，覆盖全球市场</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="30" font-size="15" font-weight="500" fill="#0C447C">医械注册全生命周期 · 7 阶段全景</text>
  <text x="40" y="48" font-size="12" fill="#5F5E5A">MedXpert-REG-001 · 20 枢纽 · 119 条官方链接已核验</text>

  <g class="c-blue">
    <rect x="40" y="66" width="76" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="78" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">需求立项</text>
    <text x="78" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">需求调研</text>
  </g>
  <line x1="116" y1="92" x2="132" y2="92" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-blue">
    <rect x="134" y="66" width="76" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="172" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">分类路径</text>
    <text x="172" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">NMPA/FDA/MDR</text>
  </g>
  <line x1="210" y1="92" x2="226" y2="92" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-teal">
    <rect x="228" y="66" width="76" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="266" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#04342C">技术文件</text>
    <text x="266" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">STED/CTD</text>
  </g>
  <line x1="304" y1="92" x2="320" y2="92" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-teal">
    <rect x="322" y="66" width="76" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="360" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#04342C">质量体系</text>
    <text x="360" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">GMP/ISO 13485</text>
  </g>
  <line x1="398" y1="92" x2="414" y2="92" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-amber">
    <rect x="416" y="66" width="76" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="454" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">注册申报</text>
    <text x="454" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">eSTAR/递交</text>
  </g>
  <line x1="492" y1="92" x2="508" y2="92" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-amber">
    <rect x="510" y="66" width="76" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="548" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">审评获批</text>
    <text x="548" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">补正/核查</text>
  </g>
  <line x1="586" y1="92" x2="602" y2="92" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g class="c-red">
    <rect x="604" y="66" width="36" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="622" y="84" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#501313">上市</text>
    <text x="622" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">后</text>
  </g>

  <rect x="40" y="140" width="600" height="56" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="160" font-size="12" font-weight="500" fill="#444441">覆盖市场</text>
  <text x="56" y="180" font-size="11" fill="#5F5E5A">中国 NMPA · 美国 FDA (510k/PMA/De Novo) · 欧盟 MDR/IVDR · 日本 PMDA · 东南亚/拉美/中东</text>

  <rect x="40" y="212" width="600" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="232" font-size="12" font-weight="500" fill="#0C447C">知识资产</text>
  <text x="56" y="252" font-size="11" fill="#185FA5">20 个专题枢纽（UDI/STED/生物相容/GMP/临床评价/软件/灭菌/变更延续/售后…）· 按全生命周期 7 阶段编排 · 中英双语 · MIT 开源</text>
</svg>
